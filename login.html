<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>تسجيل الدخول — My Link</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="./">My Link</a>
  </header>

  <main class="auth-card panel">
    <div class="tabs-bar">
      <button type="button" class="tab" data-mode="login">تسجيل الدخول</button>
      <button type="button" class="tab" data-mode="signup">إنشاء حساب</button>
    </div>

    <button type="button" class="btn google" id="google">
      <svg viewBox="0 0 48 48" width="20" height="20" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-7.9l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg>
      المتابعة بحساب جوجل
    </button>

    <div class="divider"><span>أو بالبريد الإلكتروني</span></div>

    <form id="form">
      <div id="name-field">
        <label for="name">الاسم</label>
        <input id="name" autocomplete="name">
      </div>
      <label for="email">البريد الإلكتروني</label>
      <input id="email" type="email" dir="ltr" autocomplete="email" required>
      <label for="password">كلمة المرور</label>
      <input id="password" type="password" dir="ltr" autocomplete="current-password" required minlength="6">
      <button class="btn primary wide" type="submit" id="submit"></button>
    </form>

    <p class="help center"><a href="#" id="forgot">نسيت كلمة المرور؟</a></p>
    <p class="status" id="status"></p>
  </main>

  <script src="assets/app.js"></script>
  <script type="module">
    import * as db from './assets/db.js';

    const $ = (id) => document.getElementById(id);
    const params = new URLSearchParams(location.search);

    // Only follow relative links to our own pages after login.
    const nextParam = params.get('next') || '';
    const next = /^[a-z]+\.html(\?[\w=&%-]*)?$/i.test(nextParam) ? nextParam : 'app.html';

    let mode = params.get('mode') === 'signup' ? 'signup' : 'login';

    function setMode(m) {
      mode = m;
      document.querySelectorAll('.tab').forEach((t) => t.classList.toggle('active', t.dataset.mode === m));
      $('name-field').hidden = m !== 'signup';
      $('submit').textContent = m === 'signup' ? 'إنشاء الحساب' : 'دخول';
      $('password').autocomplete = m === 'signup' ? 'new-password' : 'current-password';
      setStatus('');
    }

    function setStatus(text, kind) {
      $('status').textContent = text;
      $('status').className = 'status ' + (kind || '');
    }

    function busy(on) {
      document.querySelectorAll('button').forEach((b) => { b.disabled = on; });
    }

    document.querySelectorAll('.tab').forEach((t) => { t.onclick = () => setMode(t.dataset.mode); });
    setMode(mode);

    if (!db.isConfigured) {
      setStatus('الموقع غير مُعدّ بعد: أضف إعدادات Firebase (راجع README).', 'err');
      busy(true);
    } else {
      db.onUser((user) => { if (user) location.replace(next); });

      $('google').onclick = async () => {
        busy(true);
        try { await db.signInGoogle(); } catch (e) { setStatus(db.authErrorMessage(e), 'err'); }
        busy(false);
      };

      $('form').onsubmit = async (e) => {
        e.preventDefault();
        busy(true);
        setStatus('لحظة…');
        try {
          if (mode === 'signup') await db.signUpEmail($('name').value.trim(), $('email').value.trim(), $('password').value);
          else await db.signInEmail($('email').value.trim(), $('password').value);
        } catch (err) {
          setStatus(db.authErrorMessage(err), 'err');
        }
        busy(false);
      };

      $('forgot').onclick = async (e) => {
        e.preventDefault();
        const email = $('email').value.trim();
        if (!email) { setStatus('اكتب بريدك الإلكتروني أولاً ثم اضغط "نسيت كلمة المرور".', 'err'); return; }
        try {
          await db.resetPassword(email);
          setStatus('أرسلنا رابط إعادة تعيين كلمة المرور إلى بريدك.', 'ok');
        } catch (err) {
          setStatus(db.authErrorMessage(err), 'err');
        }
      };
    }
  </script>
</body>
</html>

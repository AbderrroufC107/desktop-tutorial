<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>إدارة البطاقات — My Link</title>
  <meta name="theme-color" content="#6d28d9">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/style.css?v=20261015">
</head>
<body>
  <header class="topbar no-print">
    <div class="container">
      <a class="logo" href="./"><span class="logo-mark"><i data-icon="nfc"></i></span>My Link <span class="chip brand">إدارة</span></a>
      <nav><a class="btn btn-sm" href="app.html"><i data-icon="user"></i>صفحتي</a></nav>
    </div>
  </header>

  <div class="page-loading" id="loading"><div class="spinner"></div><span id="loading-text"></span></div>

  <main class="dash" id="admin" hidden>
    <div class="container">
      <div class="dash-head no-print">
        <div>
          <h1>إدارة البطاقات</h1>
          <p>أنشئ بطاقات للبيع، اكتبها على NFC، وتابع تفعيلها.</p>
        </div>
      </div>

      <div class="stat-row no-print">
        <div class="stat"><div class="ic"><i data-icon="credit-card"></i></div><div><b id="s-total">0</b><span>بطاقة</span></div></div>
        <div class="stat"><div class="ic"><i data-icon="circle-check"></i></div><div><b id="s-used">0</b><span>مفعّلة</span></div></div>
        <div class="stat"><div class="ic"><i data-icon="nfc"></i></div><div><b id="s-taps">0</b><span>لمسة</span></div></div>
      </div>

      <section class="card no-print">
        <div class="card-head">
          <div>
            <h2 class="card-title">إنشاء بطاقات جديدة</h2>
            <p class="card-sub">كل بطاقة تحصل على رمز فريد. المشتري يلمسها أول مرة فينشئ حسابه وتصبح البطاقة له.</p>
          </div>
        </div>
        <div class="create-row">
          <div class="field"><label class="label" for="count">العدد</label><input class="input" id="count" type="number" min="1" max="200" value="10"></div>
          <div class="field"><label class="label" for="note">ملاحظة (اختياري)</label><input class="input" id="note" placeholder="مثال: دفعة أكتوبر" maxlength="80"></div>
          <button class="btn btn-primary" id="create" type="button" style="height:44px"><i data-icon="plus"></i>إنشاء</button>
        </div>
      </section>

      <section class="card no-print">
        <div class="card-head wrap">
          <h2 class="card-title">البطاقات</h2>
          <div class="row wrap">
            <select class="input" id="filter" style="width:auto;height:34px;font-size:13px">
              <option value="all">الكل</option>
              <option value="free">غير مفعّلة</option>
              <option value="used">مفعّلة</option>
            </select>
            <button class="btn btn-sm" id="print" type="button"><i data-icon="printer"></i>طباعة QR</button>
            <button class="btn btn-sm" id="export" type="button"><i data-icon="file-spreadsheet"></i>CSV</button>
          </div>
        </div>
        <div class="table-wrap">
          <table class="table">
            <thead><tr><th>الرمز</th><th>الحالة</th><th>اللمسات</th><th>ملاحظة</th><th></th></tr></thead>
            <tbody id="rows"></tbody>
          </table>
        </div>
      </section>

      <section class="print-sheet" id="sheet"></section>
    </div>
  </main>

  <script src="assets/icons.js?v=20261015"></script>
  <script src="assets/vendor/qrcode.js?v=20261015"></script>
  <script src="assets/app.js?v=20261015"></script>
  <script type="module">
    import * as db from './assets/db.js?v=20261015';

    MyLink.hydrateIcons();
    const $ = (id) => document.getElementById(id);
    let cards = [];
    const owners = {};

    if (!db.isConfigured) {
      $('loading-text').textContent = 'الموقع غير مُعدّ بعد: أضف إعدادات Firebase (راجع README).';
    } else {
      db.onUser(async (u) => {
        if (!u) { location.replace('login.html?next=admin.html'); return; }
        if (!(await db.isAdmin(u.uid))) {
          $('loading').innerHTML = '<div class="state-card"><div class="big-ic muted-ic">' + MyLink.svg('shield-check') + '</div><h1>هذه الصفحة لصاحب الموقع فقط</h1><p>لإضافة حسابك كمدير، استعمل معرّف الحساب التالي:</p><div class="code-box code" id="uid"></div><button class="btn btn-block" id="copy-uid" type="button">نسخ المعرّف</button></div>';
          $('uid').textContent = u.uid;
          $('copy-uid').onclick = () => MyLink.copyText(u.uid).then(() => MyLink.toast('تم النسخ ✓'));
          return;
        }
        $('loading').hidden = true;
        $('admin').hidden = false;
        load();
      });
    }

    async function load() {
      cards = await db.listCards();
      await Promise.all(cards.filter((c) => c.owner && !(c.owner in owners)).map(async (c) => {
        owners[c.owner] = '';
        const p = await db.getProfile(c.owner).catch(() => null);
        owners[c.owner] = p ? p.username : '';
      }));
      render();
    }

    function visible() {
      const f = $('filter').value;
      return cards.filter((c) => f === 'all' || (f === 'free' ? !c.owner : !!c.owner));
    }

    function iconButton(icon, title, fn, extra) {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'btn btn-sm ' + (extra || '');
      b.innerHTML = MyLink.svg(icon) + '<span></span>';
      b.querySelector('span').textContent = title;
      b.onclick = fn;
      return b;
    }

    function render() {
      $('s-total').textContent = cards.length;
      $('s-used').textContent = cards.filter((c) => c.owner).length;
      $('s-taps').textContent = cards.reduce((n, c) => n + (c.taps || 0), 0);

      const body = $('rows');
      body.innerHTML = '';
      const list = visible();
      if (!list.length) {
        body.innerHTML = '<tr><td colspan="5" class="center muted" style="padding:32px">لا توجد بطاقات بعد — أنشئ أول دفعة من الأعلى.</td></tr>';
      }
      list.forEach((c) => {
        const tr = document.createElement('tr');

        const code = document.createElement('td');
        code.innerHTML = '<span class="code"></span>';
        code.firstChild.textContent = c.id;

        const status = document.createElement('td');
        if (c.owner) {
          const a = document.createElement('a');
          a.className = 'chip ok';
          a.textContent = owners[c.owner] ? '@' + owners[c.owner] : 'مفعّلة';
          if (owners[c.owner]) { a.href = db.profileUrl(owners[c.owner]); a.target = '_blank'; }
          status.appendChild(a);
        } else {
          status.innerHTML = '<span class="chip">غير مفعّلة</span>';
        }

        const taps = document.createElement('td');
        taps.textContent = c.taps || 0;

        const note = document.createElement('td');
        note.textContent = c.note || '—';
        note.className = 'muted';

        const cell = document.createElement('td');
        const actions = document.createElement('div');
        actions.className = 'actions';
        cell.appendChild(actions);
        actions.append(
          iconButton('nfc', 'NFC', () => writeCard(c.id), 'btn-dark'),
          iconButton('copy', 'نسخ', () => MyLink.copyText(db.cardUrl(c.id)).then(() => MyLink.toast('تم نسخ رابط ' + c.id)))
        );
        if (c.owner) actions.append(iconButton('rotate-ccw', 'إعادة', async () => {
          if (!confirm('فصل البطاقة ' + c.id + ' عن صاحبها وتصفير عدّادها؟')) return;
          await db.resetCard(c.id);
          MyLink.toast('تمت إعادة تعيين البطاقة');
          load();
        }));
        actions.append(iconButton('trash-2', 'حذف', async () => {
          if (!confirm('حذف البطاقة ' + c.id + ' نهائياً؟ لن يعمل رابطها بعد ذلك.')) return;
          await db.deleteCard(c.id);
          MyLink.toast('تم حذف البطاقة');
          load();
        }, 'btn-ghost btn-danger'));

        tr.append(code, status, taps, note, cell);
        body.appendChild(tr);
      });
    }

    async function writeCard(code) {
      MyLink.toast('قرّب البطاقة ' + code + ' من ظهر الهاتف…');
      try {
        await MyLink.writeNfc(db.cardUrl(code));
        MyLink.toast('تمت كتابة البطاقة ' + code + ' ✓');
      } catch (e) {
        MyLink.toast(e.message || String(e), 'err');
      }
    }

    $('filter').onchange = render;

    $('create').onclick = async () => {
      const n = Math.max(1, Math.min(200, parseInt($('count').value, 10) || 0));
      $('create').disabled = true;
      try {
        const codes = await db.createCards(n, $('note').value.trim());
        MyLink.toast('تم إنشاء ' + codes.length + ' بطاقة ✓');
        await load();
      } catch (e) {
        MyLink.toast('فشل الإنشاء: ' + (e.message || e), 'err');
      }
      $('create').disabled = false;
    };

    $('print').onclick = () => {
      const sheet = $('sheet');
      sheet.innerHTML = '';
      visible().forEach((c) => {
        const item = document.createElement('div');
        item.className = 'print-item';
        item.innerHTML = (MyLink.qrSvg(db.cardUrl(c.id)) || '') + '<div class="code"></div>';
        item.querySelector('.code').textContent = c.id;
        sheet.appendChild(item);
      });
      window.print();
    };

    $('export').onclick = () => {
      const lines = [['code', 'url', 'status', 'owner', 'taps', 'note'].join(',')];
      cards.forEach((c) => {
        lines.push([c.id, db.cardUrl(c.id), c.owner ? 'active' : 'new', owners[c.owner] || '', c.taps || 0,
          '"' + String(c.note || '').replace(/"/g, '""') + '"'].join(','));
      });
      MyLink.downloadText('mylink-cards.csv', '﻿' + lines.join('\n'), 'text/csv');
    };
  </script>
</body>
</html>

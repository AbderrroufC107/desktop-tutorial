<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>محرر My Link</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <div class="editor">
    <div>
      <section class="panel">
        <h2>المعلومات الشخصية</h2>
        <label for="name">الاسم</label>
        <input id="name" placeholder="اسمك">
        <label for="bio">نبذة</label>
        <textarea id="bio" rows="2" placeholder="جملة قصيرة عنك"></textarea>
        <label for="avatar">رابط الصورة الشخصية</label>
        <input id="avatar" dir="ltr" placeholder="https://...">
        <label for="theme">اللون</label>
        <input id="theme" type="color" value="#6d28d9">
      </section>

      <section class="panel">
        <h2>الروابط</h2>
        <p class="help">اكتب اسم المستخدم أو الرقم فقط، والموقع يكوّن الرابط تلقائياً.</p>
        <div id="links"></div>
        <div class="actions">
          <button class="btn" id="add-link" type="button">+ إضافة رابط</button>
        </div>
      </section>

      <section class="panel">
        <h2>رابط صفحتك</h2>
        <div class="tabs">
          <label><input type="radio" name="mode" value="short" checked> رابط قصير (مستحسن لـ NFC)</label>
          <label><input type="radio" name="mode" value="long"> رابط يحتوي البيانات</label>
        </div>

        <div id="short-opts">
          <label for="slug">اسم المستخدم في الرابط</label>
          <input id="slug" dir="ltr" placeholder="abderraouf">
          <p class="help" style="margin-top:8px">
            حمّل ملف <code>profiles/&lt;الاسم&gt;.json</code> وارفعه إلى مجلد <code>profiles</code> في المستودع، ثم يعمل الرابط القصير.
          </p>
        </div>

        <label>الرابط</label>
        <div class="output" id="url"></div>
        <div class="status" id="size"></div>

        <div class="qr" id="qr"></div>

        <div class="actions">
          <button class="btn primary" id="nfc" type="button">كتابة الرابط على بطاقة NFC</button>
          <button class="btn" id="copy" type="button">نسخ الرابط</button>
          <button class="btn" id="open" type="button">فتح الصفحة</button>
          <button class="btn" id="download" type="button">تحميل ملف JSON</button>
          <button class="btn" id="import" type="button">استيراد JSON</button>
          <input type="file" id="import-file" accept="application/json,.json" hidden>
        </div>
        <div class="status" id="nfc-status"></div>
      </section>
    </div>

    <aside class="preview">
      <div id="preview" class="profile"></div>
    </aside>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
  <script src="assets/app.js"></script>
  <script>
  (function () {
    'use strict';
    var STORAGE_KEY = 'mylink-draft';
    var $ = function (id) { return document.getElementById(id); };

    // Rough usable URL space on common NFC chips (after NDEF overhead).
    var CHIPS = [['NTAG213', 132], ['NTAG215', 492], ['NTAG216', 860]];

    var state = loadDraft() || {
      name: '', bio: '', avatar: '', theme: '#6d28d9', slug: '',
      links: [{ type: 'whatsapp', value: '' }, { type: 'instagram', value: '' }]
    };

    function loadDraft() {
      try { return JSON.parse(localStorage.getItem(STORAGE_KEY)); } catch (e) { return null; }
    }
    function saveDraft() {
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) { /* storage blocked */ }
    }

    function profileData() {
      return {
        name: state.name, bio: state.bio, avatar: state.avatar, theme: state.theme,
        links: state.links.filter(function (l) { return String(l.value || '').trim(); })
      };
    }

    function baseUrl() {
      return new URL('index.html', location.href).href.replace(/index\.html$/, '');
    }

    function mode() { return document.querySelector('input[name=mode]:checked').value; }

    function slug() { return (state.slug || '').trim().toLowerCase().replace(/[^a-z0-9_-]/g, '').slice(0, 40); }

    function currentUrl() {
      if (mode() === 'long') {
        // Empty fields are dropped to keep the link as short as possible.
        var d = profileData();
        Object.keys(d).forEach(function (k) { if (d[k] === '' ) delete d[k]; });
        return baseUrl() + '#p=' + MyLink.encodeProfile(d);
      }
      return baseUrl() + (slug() && slug() !== 'me' ? '?u=' + encodeURIComponent(slug()) : '');
    }

    // ---------- form ----------

    ['name', 'bio', 'avatar', 'theme', 'slug'].forEach(function (key) {
      $(key).value = state[key] || '';
      $(key).addEventListener('input', function () { state[key] = $(key).value; update(); });
    });
    if (!state.theme) $('theme').value = '#6d28d9';

    function renderLinks() {
      var wrap = $('links');
      wrap.innerHTML = '';
      state.links.forEach(function (link, i) {
        var row = document.createElement('div');
        row.className = 'link-row';

        var type = document.createElement('select');
        Object.keys(MyLink.PLATFORMS).forEach(function (k) {
          var o = document.createElement('option');
          o.value = k;
          o.textContent = MyLink.PLATFORMS[k].label;
          type.appendChild(o);
        });
        type.value = link.type;
        type.onchange = function () { link.type = type.value; value.placeholder = MyLink.PLATFORMS[link.type].hint; update(); };

        var value = document.createElement('input');
        value.dir = 'ltr';
        value.value = link.value || '';
        value.placeholder = MyLink.PLATFORMS[link.type].hint;
        value.oninput = function () { link.value = value.value; update(); };

        var label = document.createElement('input');
        label.value = link.label || '';
        label.placeholder = 'نص الزر (اختياري)';
        label.oninput = function () { link.label = label.value; update(); };

        var tools = document.createElement('div');
        tools.className = 'row';
        [['↑', -1], ['↓', 1]].forEach(function (b) {
          var btn = document.createElement('button');
          btn.type = 'button';
          btn.className = 'btn small';
          btn.textContent = b[0];
          btn.onclick = function () {
            var j = i + b[1];
            if (j < 0 || j >= state.links.length) return;
            state.links.splice(j, 0, state.links.splice(i, 1)[0]);
            renderLinks(); update();
          };
          tools.appendChild(btn);
        });
        var del = document.createElement('button');
        del.type = 'button';
        del.className = 'btn small';
        del.textContent = '✕';
        del.title = 'حذف';
        del.onclick = function () { state.links.splice(i, 1); renderLinks(); update(); };
        tools.appendChild(del);

        row.append(type, value, label, tools);
        wrap.appendChild(row);
      });
    }

    $('add-link').onclick = function () {
      state.links.push({ type: 'website', value: '' });
      renderLinks(); update();
    };

    document.querySelectorAll('input[name=mode]').forEach(function (r) { r.onchange = update; });

    // ---------- output ----------

    function update() {
      saveDraft();
      MyLink.renderProfile($('preview'), profileData());
      document.title = 'محرر My Link';
      $('short-opts').hidden = mode() !== 'short';

      var url = currentUrl();
      $('url').textContent = url;

      var bytes = new TextEncoder().encode(url.replace(/^https?:\/\/(www\.)?/, '')).length;
      var fits = CHIPS.filter(function (c) { return bytes <= c[1]; }).map(function (c) { return c[0]; });
      var size = $('size');
      size.textContent = 'حجم الرابط: ' + bytes + ' بايت — ' +
        (fits.length ? 'يناسب: ' + fits.join('، ') : 'كبير جداً على بطاقات NFC، استعمل الرابط القصير');
      size.className = 'status ' + (fits.length ? 'ok' : 'err');

      var qrBox = $('qr');
      qrBox.innerHTML = '';
      if (window.qrcode) {
        try {
          var qr = qrcode(0, 'M');
          qr.addData(url);
          qr.make();
          qrBox.innerHTML = qr.createSvgTag({ cellSize: 4, margin: 2, scalable: true });
        } catch (e) {
          qrBox.textContent = 'الرابط طويل جداً لرمز QR.';
        }
      }
    }

    $('copy').onclick = function () {
      navigator.clipboard.writeText(currentUrl()).then(
        function () { setStatus('تم نسخ الرابط.', 'ok'); },
        function () { setStatus('تعذر النسخ، انسخ الرابط يدوياً.', 'err'); }
      );
    };

    $('open').onclick = function () { window.open(currentUrl(), '_blank', 'noopener'); };

    $('download').onclick = function () {
      var name = (mode() === 'short' && slug()) || 'me';
      MyLink.downloadText(name + '.json', JSON.stringify(profileData(), null, 2) + '\n', 'application/json');
    };

    $('import').onclick = function () { $('import-file').click(); };
    $('import-file').onchange = function () {
      var file = this.files[0];
      if (!file) return;
      file.text().then(function (txt) {
        var d = JSON.parse(txt);
        state.name = d.name || ''; state.bio = d.bio || ''; state.avatar = d.avatar || '';
        state.theme = d.theme || '#6d28d9';
        state.links = Array.isArray(d.links) ? d.links.filter(function (l) { return MyLink.PLATFORMS[l.type]; }) : [];
        ['name', 'bio', 'avatar', 'theme'].forEach(function (k) { $(k).value = state[k]; });
        renderLinks(); update();
        setStatus('تم الاستيراد.', 'ok');
      }).catch(function () { setStatus('الملف غير صالح.', 'err'); });
      this.value = '';
    };

    // ---------- NFC (Web NFC: Chrome on Android, HTTPS only) ----------

    function setStatus(text, kind) {
      var s = $('nfc-status');
      s.textContent = text;
      s.className = 'status ' + (kind || '');
    }

    $('nfc').onclick = function () {
      if (!('NDEFReader' in window)) {
        setStatus('متصفحك لا يدعم الكتابة على NFC. افتح هذه الصفحة في Chrome على أندرويد، أو انسخ الرابط واكتبه بتطبيق NFC Tools.', 'err');
        return;
      }
      var url = currentUrl();
      var ndef = new NDEFReader();
      setStatus('قرّب بطاقة NFC من ظهر الهاتف الآن…');
      ndef.write({ records: [{ recordType: 'url', data: url }] }, { overwrite: true })
        .then(function () { setStatus('تمت كتابة الرابط على البطاقة ✓', 'ok'); })
        .catch(function (e) {
          setStatus('فشلت الكتابة: ' + (e && e.message ? e.message : e) +
            ' — تأكد أن NFC مفعّل وأن البطاقة غير مقفلة وتتسع للرابط.', 'err');
        });
    };

    renderLinks();
    update();
  })();
  </script>
</body>
</html>
